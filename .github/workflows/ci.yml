name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttok
          POSTGRES_PASSWORD: ttok
          POSTGRES_DB: ttok_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttok"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test (도메인 단위 · ArchUnit · Core Loop 통합)
        run: ./gradlew build --no-daemon
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ttok_test
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
