spring:
  application:
    name: ttok-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ttok}
    username: ${DB_USERNAME:ttok}
    password: ${DB_PASSWORD:ttok}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  forward-headers-strategy: native   # ALB X-Forwarded-For → remoteAddr (rate limit)
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,metrics

ttok:
  jwt:
    # 운영은 Secrets Manager 주입. 로컬 기본값은 개발 전용
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMzJieXRlcyEh}
  crypto:
    encryption-key: ${CRYPTO_ENCRYPTION_KEY:ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=}
    hash-key: ${CRYPTO_HASH_KEY:ZGV2LW9ubHktaGFzaGluZy1rZXktMzItYnl0ZXMhISE=}
  storage:
    # S3 버킷. 로컬은 docker compose 의 localstack (STORAGE_ENDPOINT=http://localhost:4566)
    bucket: ${STORAGE_BUCKET:ttok-local}
    region: ${STORAGE_REGION:ap-northeast-2}
    endpoint: ${STORAGE_ENDPOINT:}
  links:
    join-base-url: ${JOIN_BASE_URL:https://ttok.app/join/}
    app-install-url: ${APP_INSTALL_URL:https://ttok.app/download}
    staff-invite-base-url: ${STAFF_INVITE_BASE_URL:https://admin.ttok.app/invite/}
    qr-base-url: ${QR_BASE_URL:https://ttok.app/qr/}
  alimtalk:
    mode: ${ALIMTALK_MODE:log}
  email:
    mode: ${EMAIL_MODE:log}   # log | ses
    from: ${EMAIL_FROM:no-reply@ttok.app}
  push:
    mode: ${PUSH_MODE:log}   # log | fcm (api는 발송하지 않지만 빈 구성상 포함)
    fcm:
      credentials-path: ${FCM_CREDENTIALS_PATH:}
  scheduler:
    enabled: false   # 배치·Outbox는 app-worker에서만
  # SAAS-001 새 기관을 운영사 승인 후에 쓰게 할지 (기본: 가입 즉시 이용)
  platform:
    require-approval: ${REQUIRE_INSTITUTION_APPROVAL:false}
    # 기동 시 운영사(슈퍼관리자) 계정이 하나도 없으면 아래 계정을 만들어 운영사로 지정한다.
    # 로컬 기본값은 개발 전용 — 운영은 PLATFORM_ADMIN_PASSWORD 를 반드시 주입하거나 enabled=false
    bootstrap-admin:
      enabled: ${PLATFORM_ADMIN_BOOTSTRAP:true}
      email: ${PLATFORM_ADMIN_EMAIL:admin@ttokttok.com}
      password: ${PLATFORM_ADMIN_PASSWORD:Admin1234!}
      name: ${PLATFORM_ADMIN_NAME:운영관리자}
      institution-name: ${PLATFORM_ADMIN_INSTITUTION:똑똑 운영사}
  # AUTH-006 소셜 로그인 — 카카오·네이버 개발자센터에 앱 등록 후 켠다
  social:
    kakao:
      enabled: ${KAKAO_LOGIN_ENABLED:false}
      app-id: ${KAKAO_APP_ID:}   # 숫자 앱 ID. 넣으면 다른 앱에서 발급된 토큰을 거절한다
    naver:
      enabled: ${NAVER_LOGIN_ENABLED:false}
